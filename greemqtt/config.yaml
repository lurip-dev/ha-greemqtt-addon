name: "Gree MQTT Bridge"
version: "2.0.0"
slug: "greemqtt"
description: "Gree air conditioners in Home Assistant over MQTT, with reliable reconnects"
url: "https://github.com/lurip-dev/ha-greemqtt-addon"
arch:
  - amd64
  - aarch64
  - armv7
init: false
startup: services
boot: auto
# Broadcast discovery and replies from the units need the host network.
host_network: true
services:
  - mqtt:want
options:
  devices: []
  poll_interval: 10
  discovery_interval: 300
  auto_add_discovered: true
  broadcast_addresses: []
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  mqtt_base_topic: "gree"
  discovery_prefix: "homeassistant"
  request_timeout: 3
  log_level: "INFO"
schema:
  devices:
    - host: str
      name: str?
      mac: str?
      port: port?
      key: str?
      encryption: list(auto|ecb|gcm)?
      temp_offset: list(auto|0|40)?
      uid: int?
  poll_interval: int(3,300)
  discovery_interval: int(30,3600)
  auto_add_discovered: bool
  broadcast_addresses:
    - str?
  mqtt_host: str?
  mqtt_port: port
  mqtt_username: str?
  mqtt_password: password?
  mqtt_base_topic: str
  discovery_prefix: str
  request_timeout: int(1,10)
  log_level: list(DEBUG|INFO|WARNING|ERROR)
